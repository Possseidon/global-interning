[package]
name = "global-interning"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
indexmap = "2.13.0"
serde = { version = "1.0.228", optional = true, default-features = false }

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.149"

[[example]]
name = "serde"
required-features = ["serde"]
