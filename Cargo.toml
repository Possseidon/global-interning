[package]
name = "globin"
description = "Global interning across all threads"
keywords = ["interning", "interner", "flyweight", "deduplication", "memory"]
categories = [
    "caching",
    "concurrency",
    "data-structures",
    "memory-management",
    "rust-patterns",
]
version = "0.1.0"
edition = "2024"
authors = ["Possseidon <xpossseidon@gmail.com>"]
repository = "https://github.com/Possseidon/globin"
license = "MIT"
readme = "README.md"

[dependencies]
ahash = "0.8.12"
indexmap = "2.14.0"
serde_core = { version = "1.0.229", optional = true }

[features]
serde = ["dep:serde_core"]

[dev-dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"

[[example]]
name = "serde"
required-features = ["serde"]
